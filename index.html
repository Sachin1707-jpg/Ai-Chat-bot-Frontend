<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliChat</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Prism.js Dark Theme for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: Info & Controls (Hidden/Collapsible on Mobile) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">
                        <i class="fa-solid fa-circle-nodes"></i>
                    </div>
                    <span>IntelliChat</span>
                </div>
                <button class="close-sidebar-btn" id="closeSidebarBtn" title="Close Sidebar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>

            <div class="sidebar-section">
                <h3>Prompt Starters</h3>
                <div class="prompt-suggestions">
                    <button class="suggestion-chip" data-prompt="Explain quantum physics in simple terms.">
                        <i class="fa-solid fa-lightbulb"></i> Explain Quantum Physics
                    </button>
                    <button class="suggestion-chip" data-prompt="Write a Python script to sort a list using quicksort.">
                        <i class="fa-solid fa-code"></i> Quicksort in Python
                    </button>
                    <button class="suggestion-chip" data-prompt="Draft a polite email asking for feedback on a project.">
                        <i class="fa-solid fa-pen-fancy"></i> Draft Feedback Email
                    </button>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="status-dot online"></span>
                    <span class="status-text">Backend Status: <span id="backendStatus">Checking...</span></span>
                </div>
                <div class="version">Model: Gemini 2.5 Flash</div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Top Navigation / Header -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="menu-toggle-btn" id="menuToggleBtn" title="Toggle Sidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="bot-info">
                        <h2>IntelliChat Assistant</h2>
                        <p class="status"><span class="status-pulse"></span>Active & Ready</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="header-btn" id="clearChatBtn" title="Clear conversation history">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </header>

            <!-- Chat Messages Window -->
            <section class="chat-history-container" id="chatHistoryContainer">
                <div class="chat-messages" id="chatMessages">
                    <!-- Welcome Message -->
                    <div class="message bot-message message-fade-in">
                        <div class="message-avatar">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="message-content-wrapper">
                            <div class="message-content">
                                <p>Hello! I am your IntelliChat Assistant. How can I help you today? You can ask me questions, request code help, or try one of the prompt starters in the sidebar.</p>
                            </div>
                            <span class="message-time">Just now</span>
                        </div>
                    </div>
                </div>

                <!-- Custom Loading Indicator (Pulse Animation) -->
                <div class="loading-indicator-wrapper" id="loadingIndicator">
                    <div class="message bot-message loading-state">
                        <div class="message-avatar">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="message-content-wrapper">
                            <div class="message-content loading-content">
                                <span class="dot"></span>
                                <span class="dot"></span>
                                <span class="dot"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Input Form Area -->
            <footer class="chat-input-area">
                <form id="chatForm" class="chat-form">
                    <div class="input-wrapper">
                        <textarea 
                            id="userInput" 
                            placeholder="Type a message or press '/' for commands..." 
                            rows="1" 
                            required
                        ></textarea>
                        <button type="submit" id="sendBtn" class="send-btn" title="Send Message">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </footer>
        </main>
    </div>

    <!-- JS CDN Scripts -->
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Prism.js for syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <!-- Core Application Logic -->
    <script src="script.js"></script>
</body>
</html>
